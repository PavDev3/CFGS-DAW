<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimedia</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #eef3f8;
        color: #1b2a3a;
        margin: 0;
      }
      header,
      footer {
        background-color: #1f4e79;
        color: white;
        padding: 20px;
        text-align: center;
      }
      nav {
        background-color: #163a5a;
        padding: 10px;
        text-align: center;
      }
      nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }
      nav a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 700px;
        margin: 20px auto;
        padding: 0 20px;
      }
      section {
        background-color: white;
        border-radius: 8px;
        padding: 15px 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }
      h2 {
        color: #1f4e79;
        border-bottom: 2px solid #1f4e79;
        padding-bottom: 5px;
      }
      video,
      canvas,
      svg {
        max-width: 100%;
        border: 2px solid #1f4e79;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Contenido multimedia</h1>
    </header>

    <nav>
      <a href="ejercicio3.3.html">Volver al Puerto de Algeciras</a>
    </nav>

    <main>
      <section>
        <h2>video y source</h2>
        <video controls width="400">
          <source
            src="https://www.w3schools.com/html/mov_bbb.mp4"
            type="video/mp4"
          />
          <source
            src="https://www.w3schools.com/html/mov_bbb.ogg"
            type="video/ogg"
          />
          Tu navegador no soporta el elemento video.
        </video>
      </section>

      <section>
        <h2>audio y source</h2>
        <audio controls>
          <source
            src="https://www.w3schools.com/html/horse.mp3"
            type="audio/mpeg"
          />
          <source
            src="https://www.w3schools.com/html/horse.ogg"
            type="audio/ogg"
          />
          Tu navegador no soporta el elemento audio.
        </audio>
      </section>

      <section>
        <h2>canvas</h2>
        <canvas id="lienzo" width="300" height="150">
          Tu navegador no soporta el elemento canvas.
        </canvas>
        <script>
          const ctx = document.getElementById("lienzo").getContext("2d");
          ctx.fillStyle = "steelblue";
          ctx.fillRect(20, 20, 120, 80);
          ctx.fillStyle = "orange";
          ctx.beginPath();
          ctx.arc(220, 70, 40, 0, 2 * Math.PI);
          ctx.fill();
        </script>
      </section>

      <section>
        <h2>svg</h2>
        <svg width="300" height="150" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="20" width="120" height="80" fill="steelblue" />
          <circle cx="220" cy="70" r="40" fill="orange" />
          <line
            x1="10"
            y1="130"
            x2="290"
            y2="130"
            stroke="black"
            stroke-width="3"
          />
        </svg>
      </section>
    </main>

    <footer>
      <p>Ejercicio 3.3.1 - Contenido multimedia</p>
    </footer>
  </body>
</html>
