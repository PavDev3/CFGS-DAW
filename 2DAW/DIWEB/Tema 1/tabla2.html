<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Tabla</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #555;
        padding: 0.4rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th colspan="2">A</th>
        <th>B</th>
        <th>C</th>
        <th>D</th>
      </tr>
      <tr>
        <td rowspan="2">X</td>
        <td>Y</td>
        <td>Z</td>
        <td>W</td>
      </tr>
      <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td>4</td>
      </tr>
      <thead>
        <tr>
          <td colspan="5">Tabla de ejemplo</td>
        </tr>
      </thead>
    </table>
  </body>
</html>
