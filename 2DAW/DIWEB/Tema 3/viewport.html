<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi página web</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      * {
        margin: 10px;
        padding: 10px;
      }
      .container {
        position: relative;
        height: 100vh;
      }
      .h1,
      p {
        text-align: center;
        line-height: 40vh;
      }
      .imagen {
        max-width: 100px;
        height: 100px;
      }
      div {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <h1>Titulo</h1>
    <p>Loren Ipsum</p>
    <br />
    <div>
      <img
        class="imagen"
        src="https://r-charts.com/es/miscelanea/procesamiento-imagenes-magick_files/figure-html/importar-imagen-r.png"
      />
    </div>
  </body>
</html>
