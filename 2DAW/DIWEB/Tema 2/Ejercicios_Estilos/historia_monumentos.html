<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Monumentos históricos del mundo</title>
    <style>
      body {
        font-family: system-ui;
        margin: 1rem;
      }
      .flex {
        display: grid;

        grid-template-columns: repeat(2, 1fr);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
      figure {
        margin: 0;
        border: 1px solid #ddd;
        padding: 0.5rem;
        border-radius: 4px;
      }
      figcaption {
        text-align: center;
        margin-top: 0.4rem;
        font-size: 0.9rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Monumentos históricos del mundo</h1>
    <section class="grid">
      <figure>
        <img
          src="https://picsum.photos/seed/coliseo/600/400"
          alt="Coliseo de Roma"
          width="100%"
        />
        <figcaption>
          Coliseo de Roma (Italia): anfiteatro del siglo I usado para
          espectáculos de gladiadores.
        </figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/seed/muralla/600/400"
          alt="Gran Muralla China"
        />
        <figcaption>
          Gran Muralla China: fortificaciones construidas a lo largo de siglos
          para proteger el norte de China.
        </figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/seed/piramides/600/400"
          alt="Pirámides de Giza"
        />
        <figcaption>
          Pirámides de Giza (Egipto): tumbas monumentales de más de 4.500 años.
        </figcaption>
      </figure>
      <figure>
        <img
          src="https://picsum.photos/seed/machupicchu/600/400"
          alt="Machu Picchu"
        />
        <figcaption>
          Machu Picchu (Perú): ciudadela inca situada en los Andes, construida
          en el siglo XV.
        </figcaption>
      </figure>
    </section>

    <p style="text-align: center"><a href="index.html">Volver al índice</a></p>
  </body>
</html>
