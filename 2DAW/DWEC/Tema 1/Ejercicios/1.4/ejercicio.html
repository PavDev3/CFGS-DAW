<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio Fecha</title>
  </head>
  <body>
    <h2>Ejercicio Fecha</h2>
    <label
      >Fecha inicio:
      <input
        type="date"
        name="fecha_inicio"
        value="2026-01-01"
        id="fecha_inicio"
    /></label>
    <label
      >Fecha Fin:
      <input type="date" name="fecha_fin" value="2026-12-01" id="fecha_fin"
    /></label>
    <button type="button" onclick="calcularDiferencia()">
      Calcular Diferencia
    </button>
    <p id="resultadoDiferencia">Resultado: -</p>

    <h2>Ejercicio: Calcular dias del mes</h2>
    <label
      >Año: <input type="number" name="anio" value="2026" id="anio" min="1900"
    /></label>
    <label
      >Mes: <input type="number" name="mes" value="2" id="mes" min="1" max="12"
    /></label>
    <button type="button" onclick="calcularDiasMes()">Calcular Dias</button>
    <p id="resultadoDiasMes">Resultado: -</p>
  </body>

  <script>
    const calcularDiferencia = () => {
      const fechaInicio = new Date(
        document.getElementById("fecha_inicio").value,
      );
      const fechaFin = new Date(document.getElementById("fecha_fin").value);

      const diferenciaEnMilisegundos = fechaFin - fechaInicio;
      const diferenciaEnDias = diferenciaEnMilisegundos / (1000 * 60 * 60 * 24);

      document.getElementById("resultadoDiferencia").textContent =
        `Resultado: ${diferenciaEnDias} días`;
    };

    const calcularDiasMes = () => {
      const anio = parseInt(document.getElementById("anio").value, 10);
      const mes = parseInt(document.getElementById("mes").value, 10);

      // Crear una fecha con el primer día del mes siguiente y restar un día
      const ultimoDia = new Date(anio, mes, 0).getDate();

      document.getElementById("resultadoDiasMes").textContent =
        `Resultado: El mes ${mes}/${anio} tiene ${ultimoDia} días`;
    };
  </script>
</html>
