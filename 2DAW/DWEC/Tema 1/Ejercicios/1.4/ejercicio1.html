<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script src="ejercicio1.js"></script>
    <script src="calculo.js"></script>
    <title>1.4 - El objeto Date en JavaScript</title>
  </head>
  <body>
    <h1>Ejercicios prácticos con Date</h1>

    <h2>Ejercicio 2: Diferencia en días entre dos fechas</h2>
    <label
      >Fecha inicio: <input type="date" id="fechaInicio" value="2026-01-01"
    /></label>
    <label
      >Fecha fin: <input type="date" id="fechaFin" value="2026-09-29"
    /></label>
    <button type="button" onclick="mostrarDiferencia()">Calcular</button>
    <p id="resultadoDiferencia">Resultado: -</p>

    <h2>Ejercicio 3: Último día de un mes</h2>
    <label>Año: <input type="number" id="anioMes" value="2026" /></label>
    <label
      >Mes (1-12):
      <input type="number" id="mesHumano" value="2" min="1" max="12"
    /></label>
    <button type="button" onclick="mostrarUltimoDia()">Calcular</button>
    <p id="resultadoUltimoDia">Resultado: -</p>

    <h2>Ejercicio 4: Formateador de fecha española (DD/MM/YYYY HH:mm)</h2>
    <button type="button" onclick="mostrarFechaFormateada()">
      Formatear fecha y hora actual
    </button>
    <p id="resultadoFormateado">Resultado: -</p>
  </body>
</html>
