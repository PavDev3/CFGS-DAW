<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>3.3.3 - Panel de control</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <main>
    <h2>Panel de Control Básico</h2>

    <div role="group">
      <button id="btn-oscuro">Modo Oscuro</button>
      <button id="btn-ocultar">Ocultar / Mostrar</button>
      <button id="btn-exito">Completar Tarea</button>
      <button id="btn-error">Marcar Error</button>
      <button id="btn-borde">Resaltar</button>
      <button id="btn-reset">Reiniciar</button>
    </div>

    <article id="tarjeta" class="caja estado-pendiente">
      Estado actual: Tarea pendiente de revisión.
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
