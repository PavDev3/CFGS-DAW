<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>3.2.2 - Analizador de URLs</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
</head>
<body>
  <main class="container">
    <h1>Analizador de URL actual</h1>
    <table>
      <tbody>
        <tr><td>Protocolo</td><td id="valProtocolo"></td></tr>
        <tr><td>Hostname</td><td id="valHostname"></td></tr>

        <tr><td>Parámetros (search)</td><td id="valSearch"></td></tr>
      </tbody>
    </table>
    <button id="btnRecargar">Recargar página</button>
  </main>
