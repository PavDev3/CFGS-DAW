<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>3.2.3 - Monitor de conectividad</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
  <style>
    #indicador { padding: 1rem; border-radius: var(--pico-border-radius); color: white; font-weight: bold; text-align: center; }
    .conectado { background-color: #2e7d32; }
    .desconectado { background-color: #c62828; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Monitor de conectividad</h1>
    <div id="indicador" class="conectado">Conexión Estable</div>

    <h2>Historial de cortes</h2>
    <table>
      <thead>
        <tr><th>Evento</th><th>Fecha y hora</th></tr>
      </thead>
      <tbody id="cuerpoHistorial"></tbody>
    </table>

    <button id="btnEmergencia">Ir a soporte</button>
  </main>
  <script src="3.2.3-monitor-red.js"></script>
</body>
</html>
